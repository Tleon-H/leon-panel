<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<link rel="icon" type="image/svg+xml" href="/favicon.svg">
	<link rel="alternate icon" href="/favicon.ico">
	<meta content="yes" name="apple-mobile-web-app-capable"/>
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<meta name="theme-color" content="#09090B">
	<link rel="stylesheet" href="/custom/index.css">
	<meta name="viewport"
		content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
	<meta name="application-name" content="Leon Panel">
	<meta name="apple-mobile-web-app-title" content="Leon Panel">
	<title>Leon Panel</title>
</head>

<body class="dark:bg-black">
	<div id="app">
		<style>
			.leon-boot-wrap {
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				gap: 18px;
				height: 100vh;
				background-color: #f4f4f1;
				background-image: radial-gradient(ellipse 70% 55% at 50% 0%, rgba(14, 165, 233, 0.08), transparent 70%);
				color: #0f172a;
				font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif;
			}

			.leon-boot-box {
				padding: 10px;
				border: 1px solid rgba(15, 23, 42, 0.10);
				border-radius: 16px;
				background: #ffffff;
				box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
			}

			.leon-boot-mark {
				display: block;
				width: 52px;
				height: 52px;
				border-radius: 10px;
			}

			.leon-boot-meta {
				display: flex;
				align-items: center;
				gap: 8px;
				font-size: 12px;
				font-weight: 600;
				letter-spacing: 0.14em;
				opacity: 0.85;
			}

			.leon-boot-dot {
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: #0ea5e9;
				animation: leon-boot-blink 1.2s ease-in-out infinite;
			}

			.leon-boot-track {
				width: 128px;
				height: 3px;
				border-radius: 999px;
				background: rgba(15, 23, 42, 0.10);
				overflow: hidden;
			}

			.leon-boot-bar {
				width: 44px;
				height: 100%;
				border-radius: 999px;
				background: #0ea5e9;
				animation: leon-boot-slide 1s ease-in-out infinite;
			}

			@keyframes leon-boot-blink {
				0%, 100% {
					opacity: 1;
				}
				50% {
					opacity: 0.3;
				}
			}

			@keyframes leon-boot-slide {
				0% {
					transform: translateX(-48px);
				}
				100% {
					transform: translateX(132px);
				}
			}

			@media (prefers-color-scheme: dark) {
				body {
					background: #0b0d11;
				}

				.leon-boot-wrap {
					background-color: #0b0d11;
					background-image: radial-gradient(ellipse 70% 55% at 50% 0%, rgba(14, 165, 233, 0.12), transparent 70%);
					color: #f8fafc;
				}

				.leon-boot-box {
					border-color: rgba(255, 255, 255, 0.10);
					background: #14171f;
					box-shadow: 0 12px 32px rgba(0, 0, 0, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.06);
				}

				.leon-boot-track {
					background: rgba(255, 255, 255, 0.10);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.leon-boot-dot,
				.leon-boot-bar {
					animation: none;
				}
			}
		</style>
		<div class="leon-boot-wrap" aria-label="Loading Leon Panel">
			<div class="leon-boot-box">
				<svg class="leon-boot-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" aria-hidden="true">
					<rect x="24" y="24" width="464" height="464" rx="28" fill="#F4F1EA" stroke="#09090B" stroke-width="16"/>
					<path d="M104 104H188V324H408V408H104V104Z" fill="#09090B"/>
					<circle cx="328" cy="184" r="80" fill="#FF4F00"/>
					<rect x="104" y="324" width="84" height="84" fill="#2563EB"/>
				</svg>
			</div>
			<div class="leon-boot-meta">
				<span class="leon-boot-dot"></span>
				<span>LEON PANEL</span>
			</div>
			<div class="leon-boot-track">
				<div class="leon-boot-bar"></div>
			</div>
		</div>
	</div>
	<script type="module" src="/src/main.ts"></script>
	<script src="/custom/index.js"></script>
</body>

</html>
