name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@8.15.9 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate version
        run: pnpm run version:check

      - name: Unit tests
        run: pnpm run test:unit

      - name: Type check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build

  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: service/go.sum

      - name: Generate embedded assets
        working-directory: service
        run: |
          go install github.com/go-bindata/go-bindata/go-bindata@v3.1.2+incompatible
          go install github.com/elazarl/go-bindata-assetfs/go-bindata-assetfs@v1.0.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          rm -f bindata.go
          go-bindata-assetfs -o=assets/bindata.go -pkg=assets assets/...
          rm -f bindata.go

      - name: Test and build backend
        working-directory: service
        run: |
          rm -f bindata.go
          go test -v -race -count=1 ./lib/cmn ./lib/sessionguard ./api/api_v1/panel ./router
          go test ./...
          go build -o /tmp/leon-panel main.go
          rm -f /tmp/leon-panel

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.leon-test.yml config --quiet
      - name: Build runtime image
        run: docker build -t leon-panel:ci .
