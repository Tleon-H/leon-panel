<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <pattern id="swiss-grid-pat" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" stroke="#09090B" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#F5F5F3"/>
  <rect width="1920" height="1080" fill="url(#swiss-grid-pat)"/>
  <!-- Minimal Swiss drafting register marks -->
  <line x1="0" y1="80" x2="1920" y2="80" stroke="#09090B" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="80" y="40" width="40" height="40" fill="#2563EB" fill-opacity="0.16"/>
  <rect x="1800" y="960" width="40" height="40" stroke="#09090B" stroke-opacity="0.18" stroke-width="2"/>
  <rect x="1760" y="960" width="40" height="40" fill="#2563EB" fill-opacity="0.14"/>
</svg>
