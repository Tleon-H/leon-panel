  <rect x="64" y="64" width="16" height="16" fill="#00C2A8" fill-opacity="0.45"/>
  <rect x="1840" y="1000" width="16" height="16" fill="#00C2A8" fill-opacity="0.45"/>
  <circle cx="1760" cy="160" r="56" stroke="#00C2A8" stroke-opacity="0.20" stroke-width="1.5"/>
  <line x1="1688" y1="160" x2="1832" y2="160" stroke="#00C2A8" stroke-opacity="0.22" stroke-width="1"/>
  <line x1="1760" y1="88" x2="1760" y2="232" stroke="#00C2A8" stroke-opacity="0.22" stroke-width="1"/>
</svg>
