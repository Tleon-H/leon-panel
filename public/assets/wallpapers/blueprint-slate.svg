<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <pattern id="bp-grid-sm" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" stroke="#00C2A8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="bp-grid-lg" width="160" height="160" patternUnits="userSpaceOnUse">
      <rect width="160" height="160" fill="url(#bp-grid-sm)"/>
      <path d="M 160 0 L 0 0 0 160" stroke="#00C2A8" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#0C1220"/>
  <rect width="1920" height="1080" fill="url(#bp-grid-lg)"/>
